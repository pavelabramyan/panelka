<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#050505" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050505" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Панелька</title>
  <script type="module" crossorigin src="./assets/index-BpTtw-og.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BDfzCOGy.css">
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="fade"></div>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="floor"></div>
    <div id="prompt"></div>
    <div id="subtitle"></div>
    <div id="battery"><span>🔦</span><div class="bar"><div id="battery-fill"></div></div></div>
    <div id="debug"></div>
  </div>

  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <button id="btn-pause" aria-label="Пауза"><svg width="14" height="16" viewBox="0 0 14 16" fill="currentColor"><rect x="1" y="1" width="4" height="14" rx="1"/><rect x="9" y="1" width="4" height="14" rx="1"/></svg></button>
    <div id="use-wrap">
      <div id="use-label"></div>
      <button id="btn-use" aria-label="Действие">✋</button>
    </div>
    <button id="btn-flash" aria-label="Фонарик">🔦</button>
  </div>

  <div id="reader" class="hidden">
    <div class="paper" id="paper"></div>
    <p class="hint">Нажмите, чтобы закрыть</p>
  </div>

  <div id="screen" class="screen">
    <div class="card" id="card">
      <h1>ПАНЕЛЬКА</h1>
      <p class="sub">Загрузка подъезда…</p>
    </div>
  </div>

</body>
</html>
